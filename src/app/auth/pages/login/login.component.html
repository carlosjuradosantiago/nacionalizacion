<div class="min-h-screen flex align-items-center justify-content-center login-container">
  <div class="w-full max-w-4xl flex flex-column lg:flex-row shadow-2 border-round-xl overflow-hidden login-card">

    <!-- Sección Izquierda -->
    <div class="lg:w-6 left-section p-2 lg:p-6 flex flex-column relative overflow-hidden">
      <div class="relative z-1">
        <div class="flex flex-column align-items-center mb-4">
          <img src="assets/images/img-logo-migraciones-blanco.png" alt="Migraciones Perú" class="h-6rem md:h-7rem w-auto mb-4 logo">
          <div class="decorative-lines mb-4">
            <div class="line line-1"></div>
            <div class="line line-2"></div>
          </div>
        </div>
        <br>
        <div class="flex align-items-center justify-content-center mb-4 lock-icon-container">
          <div class="relative lock-icon-wrapper">
            <i class="pi pi-lock lock-icon text-white"></i>
            <div class="decorative-circle-outer"></div>
            <div class="decorative-circle-inner"></div>
            <div class="decorative-circle-progress"></div>
          </div>
        </div>

        <h2 class="text-white text-2xl lg:text-3xl font-bold text-center mb-3 title">{{texts.title}}</h2>
        <div class="text-white-alpha-90 text-center" style="line-height: 1.5;">
          <div>{{texts.welcome}}</div>
        </div>
      </div>
    </div>

    <!-- Sección Derecha -->
    <div class="lg:w-6 right-section p-2 lg:p-6 flex flex-column">
      <div class="max-w-md mx-auto w-full">
        <h2 class="text-2xl font-bold text-800 mb-6 form-title">{{texts.loginTitle}}</h2>

        <!-- Mensaje de error en línea -->
        <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="mb-4"></p-message>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">
          <div>
            <label for="username" class="block text-sm font-medium text-700 mb-1">Usuario</label>
            <input id="username" type="text" pInputText [placeholder]="texts.usernamePlaceholder"
                   formControlName="username" class="w-full" />
            <small *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched" 
                   class="p-error block mt-1">El nombre de usuario es requerido</small>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-700 mb-1">Contraseña</label>
            <p-password id="password" [placeholder]="texts.passwordPlaceholder" [toggleMask]="true"
                      [feedback]="false" formControlName="password" styleClass="w-full" inputStyleClass="w-full">
            </p-password>
            <small *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched" 
                   class="p-error block mt-1">La contraseña es requerida</small>
          </div>

          <div class="pt-2">
            <button pButton type="submit" [label]="isLoading ? 'Verificando...' : 'INGRESAR'" 
                    class="p-element p-button-primary p-button p-component p-button-full-width" 
                    [loading]="isLoading" [disabled]="isLoading"
                    title="Ingresar al sistema">
            </button>
          </div>

          <div class="flex flex-column align-items-center justify-content-center gap-3 mt-4">
            <a href="#" class="text-sm forgot-password-link hover:text-cyan-500 transition-colors">{{texts.forgotPassword}}</a>
            <p class="text-xs text-500 support-text">{{texts.support}}
              <a [href]="'mailto:' + texts.supportEmail" class="text-blue-600 hover:underline">{{texts.supportEmail}}</a>
            </p>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>

<p-toast></p-toast>
